name: Build n-client 2.7 beta - connection metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 2.7 beta: opt-in connection metadata profile. Includes 2.6 movable music/controls and all previous fonts, TAS and laser fixes.")

      - name: Get bundled fonts from this repository
        uses: actions/checkout@v4
        with:
          path: nclient-assets
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: n-client-fonts.zip
          sparse-checkout-cone-mode: false

      - name: Install bundled OFL fonts (hash verified)
        working-directory: ddnet
        shell: python
        run: |
          import hashlib, zipfile, io
          from pathlib import Path
          bundle = Path("../nclient-assets/n-client-fonts.zip")
          if not bundle.is_file():
              raise RuntimeError("Upload n-client-fonts.zip to the ROOT of your repository, beside README.md, then run this workflow again. Do not unpack or rename it.")
          if bundle.stat().st_size > 8 * 1024 * 1024:
              raise RuntimeError("Unexpected font bundle size")
          data = bundle.read_bytes()
          if hashlib.sha256(data).hexdigest() != "94c5eb61801f4e0298f2a2df9498b9af52b93a1ae24509cc19211182540e22b1":
              raise RuntimeError("Font bundle SHA256 mismatch. Upload the supplied n-client-fonts.zip without changes.")
          expected = {'Arimo-Cactus.ttf': 'a802b4248553bfde9b0acd5332aefd9b104f89e8e972a7d10d9c4bfddb18b510', 'Cabin-Regular.ttf': '7961df8f47e772f16bb63fa6a938d742b53f7404ec9760e57e6d3ace1215fc18', 'Montserrat-Regular.ttf': 'c3fb0280e4339f6c70cea42b8b432c6fb17fde130fbb12e9209c7cdfa79d976f', 'Nunito-Black.ttf': '781ed063526ea50c2ad66095143cd4fdc1033cec21849adca980c09a0a7d5ba2', 'Pacifico-Regular.ttf': '4dac9db3fa9ca072f7861fd916bf04bdceac6069d0f3a886f5e523d922e918f1', 'Rubik-Regular.ttf': '7839aacdcb2c000467353ab4bdf313e87f813ec8e2beb4f5d42fdbcd8b6edd6c', 'RubikBrokenFax-Regular.ttf': '4285e8b276172f657bb9c199f30b11091ff4c2655f2a45f798930d6cb44e1899', 'RubikDoodleShadow-Regular.ttf': '99032f3afa3a0ea7f8dc95e8c7e1548e763bdaf86d41036787c7e8667d31e034'}
          archive = zipfile.ZipFile(io.BytesIO(data))
          for name, sha256 in expected.items():
              if archive.getinfo(name).file_size > 8 * 1024 * 1024:
                  raise RuntimeError("Unexpected font size: " + name)
              font = archive.read(name)
              if hashlib.sha256(font).hexdigest() != sha256:
                  raise RuntimeError("Font integrity failed: " + name)
              Path("data/fonts", name).write_bytes(font)
          print("Verified", len(expected), "bundled OFL font assets. No connection to the Cactus download server.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 2.7 beta, official DDNet 20.1, Windows x64.
          Settings -> n-client -> Network: opt-in override of advertised CLIENTVER string (including git hash in parentheses) and DDNet version number. Disabled by default. Empty fields use actual data; number 0 keeps actual DDNet number. Invalid hash/text/oversized combined strings revert to the complete original profile and show a reason, rather than sending partially inconsistent metadata.
          TClient 10.8.6 metadata preset is taken from official tag V10.8.6, commit 82d946145072e18f9513ba24275389710e88df08; numeric DDNet version is 19080. The actual advertised hash is its 32-character prefix 82d946145072e18f9513ba2427538971, matching upstream scripts/git_revision.py (--short=32); the tutorial's TClient hash matches this source-derived prefix. The preset only fills fields, it does not enable the override automatically. Source: https://github.com/TaterClient/TClient/tree/V10.8.6
          Select preset, explicitly enable override, then reconnect. The main and dummy each capture their handshake profile. Subsequent CL_ISDDNETLEGACY numbers match that connection's initial CLIENTVER, even if settings are later edited. Existing connected sessions do not change their advertised metadata mid-connection.
          Custom console options: spoof_version 0/1; spoof_version_str "TClient 10.8.6"; spoof_git_hash "82d946145072e18f9513ba2427538971"; spoof_ddnet_version 19080. The client name/version field must not already contain hash parentheses. The UI has a preview and a Restore real data button.
          This is METADATA ONLY, not complete emulation of Tater and NOT a guaranteed bypass of 0XF/TeeFusion/Unstable bad-client checks. No IAMTATER announcement or Tater checksum challenge emulation was added. The normal checksum handler, real local version/build reporting, NETVERSION/NETVERSION7, CLIENT_VERSION7, ConnectionID and password/authentication flows are unchanged. Use modified clients only where the server permits them.
          Current normal n-client builds already inherit the official DDNet 20.1 name and base git revision, because the workflow applies an uncommitted patch to that fixed base. Therefore a server's bad-client result cannot be assumed to depend only on a visible custom n-client brand or version string.
          Includes 2.6 music: full-screen placement editor at n-client -> Interface -> Move/control. Drag title, use Previous / Pause or Play / Next buttons; Escape or Done returns to settings. Position is saved and clamped to screen. Commands run in the background, target the displayed session token and do not use broadcast multimedia keys. Unsupported actions/title-only fallback have disabled controls.
          Includes global font selection and all paired dummy TAS, held step-speed and 2.4 laser/unhook fixes. Keep the SAME n-client-fonts.zip in the ROOT of the repository. SHA256 checks remain; no Cactus download server dependency. Start a NEW Actions run on the branch containing both workflow and font archive.
          Local checks: Linux syntax of entire engine client.cpp using official SDL headers and checked-in Rust bridge headers, gameclient/menu/settings/music/renderer and old modified components; actual CPacker/Unpacker profile round trips with untouched UUID and disabled byte-for-byte baseline; opt-in/empty/invalid hash/text/UTF8/length tests, independent frozen connection values; unchanged protocol constants and ordinary checksum handler; music, TAS/dummy/step-speed/input/learning/unhook regressions; clean-base patch/source hashes and unchanged font ZIP checks; YAML and embedded payload validation.
          Windows compilation/runtime, target-server acceptance and real media playback controls have NOT been verified here. Build in GitHub Actions and test on the user's PC; no claim of undetectability is made.
          Extract the Actions artifact into a fresh directory with executable, data and DLLs together. No handoff generated.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-2.7-beta-identity-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
