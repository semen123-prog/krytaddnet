name: Build n-client 2.0 beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 2.0 beta patched onto DDNet 20.1. Verified beta 2.0 and stable 1.8 fallback are available in Settings.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 2.0 beta based on official DDNet 20.1, Windows x64.
          Settings -> n-client -> Laser: enable Laser Auto Unfreeze and Beta 2.0.
          cl_unfreeze_beta 1: verified tutorial beta. cl_unfreeze_beta 0: stable 1.8 solver.
          Beta predicts 64 ticks, searches all 360 degrees, refines multiple angles at 0.3 degrees, and uses server bounce-delay ticks. New default step: 3 degrees; max bounces: 3. Server tuning and the time budget still limit search.
          Click the search-settings preset for 3-degree beta search, 3 bounces and a 6 ms budget. Existing saved settings are preserved until you change them.
          The return target is now AFTER the spatial freeze-strip exit, not exit-2. Future candidates no longer suppress valid shots due now.
          Every queued beta shot is checked with the native predicted laser and world: first owner hit must actually unfreeze, early hits and intercepted rays are rejected, and the character must stay unfrozen for 2 simulation ticks.
          This uses a single current-launch native check, not the stable 1.8 early/current/late triple verification. Budget is reserved for checking multiple candidates, with no unverified-shot fallback.
          Scheduled future shots are recomputed every tick. The rifle can be selected automatically when freeze is ahead. Actual reload/freeze checks remain. Manual input wins and release-packet aim preservation is unchanged.
          Beta learning is disabled to avoid changing stable timing calibration. Stable 1.8 and TAS are otherwise unchanged.
          Local checks: C++ syntax, input/hook/TAS/learning/packet-loss regression tests, clean-base patch/hash verification, YAML payload. Native synthetic physics tests cover early owner hit, immediate refreeze, actual thaw and validated alternative angles.
          Windows build and real-server accuracy have NOT been verified. Future input changes, network timing and incomplete prediction can still cause misses. No guarantee of unfreezing.
          Use only on local servers or servers permitting automated assistance.
          Keep DDNet.exe with data and DLLs. Do not replace your Steam installation.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-2.0-beta-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
