name: Build n-client 2.1 beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 2.1 beta patched onto DDNet 20.1. Verified beta 2.1 and stable 1.8 fallback are available in Settings.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 2.1 beta based on official DDNet 20.1, Windows x64.
          Settings -> n-client -> Laser: enable Laser Auto Unfreeze and Beta 2.1. Stable 1.8 solver remains available with cl_unfreeze_beta 0.
          Click the search preset for 3-degree beta search, 3 bounces and a 6 ms budget. Existing saved slider settings are preserved until you change them.
          Beta retains 64-tick tutorial angle search, multi-angle 0.3-degree refinement, native first-hit checks and two unfrozen ticks after the hit.
          2.1 prefers centered returns in the score. Native maximum hit offset is 20 pixels normally and 16 immediately after hook release, instead of accepting grazing 28-pixel hits.
          Immediately after unhook, the same wire aim must also thaw under one-tick-later launch. If the launch world still has an attached hook, a sensitivity branch keeps that hook for one extra physics tick before releasing. Unstable candidates are rejected; no blind forced shot delay.
          Extra checks reserve more of the existing CPU budget, rather than bypassing it. Smaller budgets can mean no shot. If a delayed branch cannot legally shoot before freeze, that candidate is rejected.
          Input queue guard cancels an unsent shot when hook/direction/jump changes after solving. Manual fire has priority. Physical controls are not overridden; release-packet aim preservation is unchanged.
          Status reports no stable post-unhook shot when relevant. beta_unhook_verified is written to the existing local feedback CSV when that shot is solved on a detected release transition.
          Local tests: native synthetic cases of freeze, early hits, refreeze, centered thaw, airborne attached-hook release with right held, current/late/hook-lag branches and source-world isolation; guarded-input and input/hook/TAS/learning/packet-loss regressions; C++ syntax; clean-base patch/hash, YAML and embedded payload.
          The hook-release tests also ran at a 6 ms solver budget. These are controlled simulations, not reproduction of the user's exact server/map state.
          Windows build and real-server accuracy have NOT been verified. The exact cause of the reported miss is not established; this is a targeted robustness improvement, not a guarantee of unfreezing.
          TAS uses its previous stable solver. Beta learning remains disabled. The common guarded normal-shot input path also applies to the stable fallback.
          Use only on local servers or servers permitting automated assistance. Keep DDNet.exe with data and DLLs; do not replace your Steam installation.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-2.1-beta-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
