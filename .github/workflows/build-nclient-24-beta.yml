name: Build n-client 2.4 beta - laser unhook fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 2.4 beta patched onto DDNet 20.1. Fresh unhook forecasts, real CPU deadlines and historical early-launch checks.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 2.4 beta based on official DDNet 20.1, Windows x64.
          Settings -> n-client -> Laser: enable Laser Auto Unfreeze and Beta 2.4. The normal search preset is 3 degrees, 3 bounces, 6 ms. Saved slider values are not forcibly replaced.
          Fix: search deadlines now use the uncached steady clock. DDNet time_get() is cached for an entire client frame and previously could not stop a long search. Over-budget results are not queued.
          Fix: hook/direction/jump changes invalidate the drawn forecast immediately, even within the same prediction tick. A same-label search may run again only if the motion input changed.
          Fix: after unhook, Beta verifies the same shot aim against the actual historical earlier world when available. Its first physics tick uses that tick's known previous input, including the old hook aim; release and shot aim apply at the scheduled next tick.
          The 2.1 current/late/hook-lag checks remain, as do centered return limits and native first-hit/thaw checks. No hand-reset of real hook, velocity or physical controls. The stable search's early branch also uses known historical input.
          Unsent shots are still cancelled if hook/direction/jump changes after solving. Manual fire retains priority and the release packet retains its shot aim. An already transmitted shot cannot be withdrawn, nor can the client know a future user release.
          CPU budgets are now actually enforced. Budget expired or no stable shot can mean no shot; raising margins or firing while frozen was not used to hide the problem.
          Paired TAS from 2.2 and the independent held rewind/forward slider from 2.3 are included. TAS -> step speed 1-100 ticks/s; a tap is one tick. Its normal plan speed is separate.
          Tests run: syntax of laser, controls, overlay, TAS, settings and gameclient; actual DDNet character/core/collision/laser on a synthetic map with attached hook/right held and new release, current and historical early thaw; 20 cached-clock beta searches at a 6 ms budget and source-world isolation; cached-clock 2 ms native deadline regression; same-tick input and stale-shot queue tests; old TAS/input/learning and paired/step-speed regressions; clean-base apply/hash, YAML/payload checks.
          The native fixture uses real physics but a synthetic tile map and an abort-only assertion logger. It does not reproduce the exact user map/server state.
          Windows/GitHub Actions build and real-server behavior have NOT been verified. This is a targeted bug fix, not a guarantee of unfreezing.
          Use only where automated assistance is permitted. Extract into a new directory and keep the executable with its data and DLLs.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-2.4-beta-unhook-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
