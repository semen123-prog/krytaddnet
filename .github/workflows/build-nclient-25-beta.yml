name: Build n-client 2.5 beta - fonts and now playing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 2.5 beta: global font selection and local Windows now-playing; includes paired TAS, step speed and unhook fix.")

      - name: Get licensed Cactus font assets (hash verified)
        working-directory: ddnet
        shell: python
        run: |
          import urllib.request, hashlib, zipfile, io, time
          from pathlib import Path
          url = "https://dw.cactuss.top/1.15/Cactus-1.15-public-win64.zip"
          archive_sha256 = "f62552c2d263c397d440e90b0914959ce559efc111687e12f577e95cd1922894"
          expected = {'Arimo-Cactus.ttf': 'a802b4248553bfde9b0acd5332aefd9b104f89e8e972a7d10d9c4bfddb18b510', 'Cabin-Regular.ttf': '7961df8f47e772f16bb63fa6a938d742b53f7404ec9760e57e6d3ace1215fc18', 'Montserrat-Regular.ttf': 'c3fb0280e4339f6c70cea42b8b432c6fb17fde130fbb12e9209c7cdfa79d976f', 'Nunito-Black.ttf': '781ed063526ea50c2ad66095143cd4fdc1033cec21849adca980c09a0a7d5ba2', 'Pacifico-Regular.ttf': '4dac9db3fa9ca072f7861fd916bf04bdceac6069d0f3a886f5e523d922e918f1', 'Rubik-Regular.ttf': '7839aacdcb2c000467353ab4bdf313e87f813ec8e2beb4f5d42fdbcd8b6edd6c', 'RubikBrokenFax-Regular.ttf': '4285e8b276172f657bb9c199f30b11091ff4c2655f2a45f798930d6cb44e1899', 'RubikDoodleShadow-Regular.ttf': '99032f3afa3a0ea7f8dc95e8c7e1548e763bdaf86d41036787c7e8667d31e034'}
          data = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=90) as response:
                      data = response.read(100 * 1024 * 1024 + 1)
                  if hashlib.sha256(data).hexdigest() != archive_sha256:
                      raise RuntimeError("Cactus archive changed: expected pinned SHA256. Refusing unverified assets.")
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(2 * (attempt + 1))
          archive = zipfile.ZipFile(io.BytesIO(data))
          for name, sha256 in expected.items():
              font = archive.read("Cactus-1.15-public-win64/data/cactus/fonts/" + name)
              if hashlib.sha256(font).hexdigest() != sha256:
                  raise RuntimeError("Font integrity failed: " + name)
              Path("data/fonts", name).write_bytes(font)
          print("Verified", len(expected), "OFL font assets; no Cactus code executed.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 2.5 beta, official DDNet 20.1, Windows x64.
          Settings -> n-client -> Interface: select the font for menus, chat, HUD, console and editor. The selection is saved and applied next frame, without restart; text containers are invalidated, icon fonts and language fallbacks remain intact.
          Includes the unmodified OFL font files found in Cactus 1.15: Arimo, Cabin, Montserrat, Nunito Black, Pacifico, Rubik, Rubik Broken Fax and Rubik Doodle Shadow. See data/fonts/NCLIENT-FONT-LICENSES.txt. Missing Cyrillic in Cabin falls back to DejaVu Sans.
          Comic Sans MS is optionally read from this PC's Windows Fonts directory, not copied or redistributed. If it is not installed, the setting shows no file.
          Google Sans and Minecraft are NOT bundled: Cactus's Google Sans file explicitly disallows open-source redistribution, and Minecraft has no supplied distribution license. Users with appropriately licensed files can put GoogleSans-Regular.ttf or Minecraft.ttf into data/fonts/custom and restart. ComicSansMS.ttf can also be loaded locally. Missing fonts cannot be selected; unavailable saved fonts safely revert to DejaVu Sans.
          Local now-playing card: Windows media sessions (Windows 10 1809+). Chooses playing sessions ahead of paused/current sessions, shows title/artist and playing/paused/stopped state. Background polling, bounded async waits/cancellation and metadata size limits. No game-thread WinRT waiting, no account login, no playback control, no outgoing music requests.
          Optional title-only fallback: Spotify/Yandex Music desktop windows and recognized Yandex Music browser windows. It cannot prove playback state or title/artist roles, so the whole window title is shown with an explicit unknown-state label. Generic app/window titles and unrelated browser tabs are rejected.
          This is NOT a universal/100 percent music detector. The application must publish media metadata or a recognizable window title. No metadata -> honest no-data status, not a fabricated or permanently cached old track. Settings show the detection reason. Position slider moves the top-left card vertically, below the weapon bar by default.
          Fonts are fetched at build time from the official Cactus 1.15 archive; SHA256 for archive and each OFL font is pinned. Changed/unavailable upstream assets fail the build clearly, never silently replace trusted files. No Cactus binary is executed.
          Includes all 2.4 unhook/real CPU deadline fixes, paired dummy TAS from 2.2, and independent held rewind/forward speed from 2.3. Laser and TAS physics are unchanged by this release.
          Tested locally: Linux syntax for renderer/gameclient/settings/music and existing changed components; actual font family names/Cyrillic fallback; metadata filtering/ranking/UTF-8 limits; bounded wait/stop cancellation; TAS/dummy/step-speed/input/learning/unhook regressions; native synthetic DDNet laser fixture; clean official-base patch, font SHA256s and YAML/payload validation.
          Windows compilation and real Spotify/Yandex playback have NOT been run here. GitHub Actions must build the Windows executable, then runtime behavior must be tested on the user's PC. A syntactic Linux check does not validate the WinRT code path.
          Extract the Actions artifact into a fresh directory. Keep executable, data and DLLs together. Use automated gameplay assistance only where allowed. No handoff generated.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-2.5-beta-music-fonts-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
