name: Build n-client 1.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 1.2 patched onto DDNet 20.1. Movement preview and strict validation are available in Settings.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 1.2 based on official DDNet 20.1, Windows x64.
          Open Settings -> n-client to toggle features. Strict validation and movement preview default to ON.
          Toggle: bind h "toggle cl_laser_auto_unfreeze 0 1"
          Equip rifle. Held hook, jump and direction are predicted. TAS record/replay (no address filter) lives in Settings -> n-client -> TAS. Manual fire still takes priority. New hooks launch before auto aim. Status explains rejected shots.
          It shoots BEFORE entering freeze; it cannot shoot while already frozen.
          Requires prediction. Future input changes and latency can invalidate the shot.
          Use only on local servers or servers that permit automated assistance.
          Local session-only feedback calibrates server shot timing. It is not a neural network or a guarantee of unfreezing. Numeric feedback is saved locally to nclient-feedback-08.csv when enabled; no upload. Disable super/invincible for testing.
          Keep DDNet.exe with data and DLLs. Do not replace your Steam installation.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-1.2-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
