name: Build n-client 1.9 beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 1.9 beta patched onto DDNet 20.1. Tutorial beta and stable 1.8 fallback are available in Settings.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 1.9 beta based on official DDNet 20.1, Windows x64.
          Open Settings -> n-client -> Laser. Enable Laser Auto Unfreeze. Tutorial beta defaults ON.
          cl_unfreeze_beta 1: tutorial geometry mode. cl_unfreeze_beta 0: stable 1.8 solver.
          Beta predicts 64 ticks, searches all 360 degrees on a 5-degree grid, then refines at 0.3 degrees. Default max bounces is 3, capped by server tuning. Search is time-budgeted.
          Beta targets freeze exit -2 through +5 ticks, uses radius 28 and tutorial scoring. Native per-bounce tick delay is used, not continuous laser flight speed.
          If the freeze timer does not end within 64 ticks, beta uses exit from the freeze tiles. Scheduled shots are recomputed from future launch position every tick; stale cached aim is not fired.
          Beta can select an owned rifle when freeze is ahead. It cannot shoot while already frozen or reloading. Manual input has priority. Release packet preserves shot aim when needed.
          Beta skips stable 1.8 strict multi-launch verification, three-clear-tick checks, and adaptive calibration. It can shoot more often but can miss or re-freeze.
          TAS remains on the stable solver; recorded aim/fire are replayed without re-solving.
          Local syntax and small unit tests only. Windows build and real-server accuracy have NOT been verified. This is not a guarantee of unfreezing.
          Use only on local servers or servers permitting automated assistance.
          Keep DDNet.exe with data and DLLs. Do not replace your Steam installation.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-1.9-beta-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
