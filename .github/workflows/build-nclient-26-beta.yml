name: Build n-client 2.6 beta - movable music and controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Get official DDNet 20.1 source
        uses: actions/checkout@v4
        with:
          repository: ddnet/ddnet
          ref: 'c9d208138f85755521f16a0096b6fe036c5c8698'
          submodules: recursive
          persist-credentials: false
          path: ddnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded laser assist patch
        working-directory: ddnet
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(["git", "apply", "--check", "--whitespace=nowarn", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--whitespace=nowarn", "-"], input=patch, check=True)
          print("n-client 2.6 beta: screen-wide music card placement and explicit media-session controls; includes global fonts, paired TAS, step speed and unhook fix.")

      - name: Get bundled fonts from this repository
        uses: actions/checkout@v4
        with:
          path: nclient-assets
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: n-client-fonts.zip
          sparse-checkout-cone-mode: false

      - name: Install bundled OFL fonts (hash verified)
        working-directory: ddnet
        shell: python
        run: |
          import hashlib, zipfile, io
          from pathlib import Path
          bundle = Path("../nclient-assets/n-client-fonts.zip")
          if not bundle.is_file():
              raise RuntimeError("Upload n-client-fonts.zip to the ROOT of your repository, beside README.md, then run this workflow again. Do not unpack or rename it.")
          if bundle.stat().st_size > 8 * 1024 * 1024:
              raise RuntimeError("Unexpected font bundle size")
          data = bundle.read_bytes()
          if hashlib.sha256(data).hexdigest() != "94c5eb61801f4e0298f2a2df9498b9af52b93a1ae24509cc19211182540e22b1":
              raise RuntimeError("Font bundle SHA256 mismatch. Upload the supplied n-client-fonts.zip without changes.")
          expected = {'Arimo-Cactus.ttf': 'a802b4248553bfde9b0acd5332aefd9b104f89e8e972a7d10d9c4bfddb18b510', 'Cabin-Regular.ttf': '7961df8f47e772f16bb63fa6a938d742b53f7404ec9760e57e6d3ace1215fc18', 'Montserrat-Regular.ttf': 'c3fb0280e4339f6c70cea42b8b432c6fb17fde130fbb12e9209c7cdfa79d976f', 'Nunito-Black.ttf': '781ed063526ea50c2ad66095143cd4fdc1033cec21849adca980c09a0a7d5ba2', 'Pacifico-Regular.ttf': '4dac9db3fa9ca072f7861fd916bf04bdceac6069d0f3a886f5e523d922e918f1', 'Rubik-Regular.ttf': '7839aacdcb2c000467353ab4bdf313e87f813ec8e2beb4f5d42fdbcd8b6edd6c', 'RubikBrokenFax-Regular.ttf': '4285e8b276172f657bb9c199f30b11091ff4c2655f2a45f798930d6cb44e1899', 'RubikDoodleShadow-Regular.ttf': '99032f3afa3a0ea7f8dc95e8c7e1548e763bdaf86d41036787c7e8667d31e034'}
          archive = zipfile.ZipFile(io.BytesIO(data))
          for name, sha256 in expected.items():
              if archive.getinfo(name).file_size > 8 * 1024 * 1024:
                  raise RuntimeError("Unexpected font size: " + name)
              font = archive.read(name)
              if hashlib.sha256(font).hexdigest() != sha256:
                  raise RuntimeError("Font integrity failed: " + name)
              Path("data/fonts", name).write_bytes(font)
          print("Verified", len(expected), "bundled OFL font assets. No connection to the Cactus download server.")

      - name: Select MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows x64 client
        shell: pwsh
        run: >-
          cmake -S ddnet -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF
          -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=OFF
          -DVULKAN=OFF -DVIDEORECORDER=OFF -DEXCEPTION_HANDLING=ON

      - name: Build and package
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          $archive = Get-ChildItem build -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows client package was not generated" }
          Expand-Archive -Path $archive.FullName -DestinationPath upload
          @'
          Experimental n-client 2.6 beta, official DDNet 20.1, Windows x64.
          Music card: Settings -> n-client -> Interface -> Move / control. Drag the title area anywhere on screen. Previous / Pause or Play / Next buttons are below the title. Escape or Done returns to settings. Position is saved; Reset position restores the default. In normal gameplay the card does not intercept aim/clicks.
          The dedicated full-screen editor uses the existing menu cursor and consumes menu input, so a music click does not also fire or hook. Horizontal placement is relative to available screen width; vertical placement is in 300-unit HUD space. Positions are clamped to the screen, including after resizing. Mouse drag is cancelled on reset/resize/exit.
          Optional shortcut, configured by the user in the console: bind f8 "cl_nmusic_edit 1". Do not replace an existing useful bind without checking it. Escape closes editing; this is not an automatic default bind.
          Explicit playback requests run on the Windows background worker, never the render thread. The command carries the token of the displayed media session. A disappeared/replaced session rejects a stale command instead of controlling another player. Control capabilities are rechecked at dispatch; requests have a timeout and are not automatically retried. One command may be pending at a time. Errors/unsupported actions are shown honestly.
          Windows media sessions supply title/artist and playing/paused/stopped state. Spotify/Yandex window-title fallback still labels playback state unknown and DOES NOT provide playback controls. No broadcast multimedia keys, process injection, login or music network requests are used. Buttons are disabled when the session does not expose the requested action.
          Includes 8 unmodified OFL fonts from Cactus 1.15, selected globally for menus/chat/HUD/console/editor without restart: Arimo, Cabin, Montserrat, Nunito Black, Pacifico, Rubik, Rubik Broken Fax, Rubik Doodle Shadow. DejaVu Sans and language/icon fallbacks remain. Comic Sans MS can be read from this PC's Windows Fonts directory. Google Sans/Minecraft are not redistributed; optional appropriately licensed custom files are described in data/fonts/NCLIENT-CUSTOM-FONTS.txt.
          Keep the existing n-client-fonts.zip in the ROOT of the repository. This release uses the SAME archive as 2.5. Archive and individual font SHA256 values are checked; the Cactus download server is not contacted. Upload this workflow before starting a NEW run on the branch that contains the font archive.
          All 2.4 unhook/real CPU deadline fixes, paired dummy TAS from 2.2 and independent held rewind/forward speed from 2.3 remain. Their physics are unchanged.
          Local checks: syntax of music/menu/settings/gameclient and prior changed client sources; screen bounds, resize/narrow-screen position round trips; action capability/pending/fallback gates and stale-session tokens; bounded waits/cancellation, metadata ranking/filtering/UTF8; TAS/dummy/step speed/input/learning/unhook regressions; clean base patch, source hashes, font installation and YAML/payload validation.
          Windows compilation and live Spotify/Yandex playback controls have NOT been run here. The Windows code path must build in Actions and be tested on the user's PC. A media publisher may omit metadata or actions; this is not a universal detector/control guarantee.
          Extract the Actions artifact into a new directory, keeping executable/data/DLLs together. Use automated gameplay assistance only where permitted. No handoff generated.
          '@ | Set-Content upload/README-n-client.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: n-client-2.6-beta-music-controls-win64
          path: upload/
          if-no-files-found: error
          retention-days: 14
